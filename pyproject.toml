[tool.ruff]
target-version = "py310"
line-length = 140
cache-dir = "C:/Users/zouhuancan/AppData/Local/Temp/aicodepilot_ruff_cache"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "data/vector_store",
    "dist",
    "frontend/.next",
    "frontend/node_modules",
    "htmlcov",
]

[tool.ruff.lint]
# Keep the first lint gate focused on correctness-level Python issues.
# Formatting, import ordering, and type strictness are configured in later
# Phase 6 tasks so each quality gate can be introduced and validated cleanly.
select = ["E", "F"]

[tool.black]
target-version = ["py310"]
line-length = 140
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | data/vector_store
  | dist
  | frontend/\.next
  | frontend/node_modules
  | htmlcov
)/
'''

[tool.mypy]
python_version = "3.10"
packages = ["app"]
mypy_path = "backend"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
strict_optional = true
exclude = [
    "^frontend/",
    "^data/",
    "^backend/data/",
]
